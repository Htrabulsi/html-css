<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container {
            border: 3px solid blue;

            display: grid;
            gap: 5px; /* Espaço entre os itens. */

            grid-template-rows: repeat(3, 80px);
            /* Exemplos feitos:
            grid-template-rows: 1fr 1fr 1fr;            
            grid-template-rows: 80px 80px 80px; */

            grid-template-columns: 100px 40% repeat(2, 1fr);
            /* Exemplos feitos:
            grid-template-columns: 4fr repeat(2, 1fr);
            grid-template-columns: repeat(3, 1fr);                 
            grid-template-columns: 1fr 1fr 1fr; => divide o valor do grid por 3;
            grid-template-columns: 120px 120px 120px; */
            
            grid-auto-flow: row;
            /* Automatiza para que os próximos itens que forem criados - além dos 3 itens colocados - (apareçam na linha abaixo. */

            grid-auto-rows: 80px;
            /* Automatiza as proximas linhas que forem adicionadas - além dos 3 itens colocados - apareçam já com os valores especificados */

            grid-auto-columns: 120px; 
            /* Automatiza as proximas colunas que forem adicionadas - além dos 3 itens colocados - apareçam já com os valores especificados */             
        
            place-items: normal normal;
            place-content: normal normal;
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>  
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
