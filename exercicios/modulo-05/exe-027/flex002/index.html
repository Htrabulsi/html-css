<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        div.conteiner-1 {
            background-color: lightsalmon;
            display: flex;
            flex-direction: row;
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column-reverse; */
        }

            div.conteiner-2 {
            background-color: lightsalmon;
            display: flex;
            /* flex-direction: row; */
            flex-direction: column;
            /* flex-direction: row-reverse; */
            /* flex-direction: column-reverse; */
        }

            div.conteiner-3 {
            background-color: lightsalmon;
            display: flex;
            /* flex-direction: row; */
            /* flex-direction: column; */
            flex-direction: row-reverse;
            /* flex-direction: column-reverse; */
        }

                div.conteiner-4 {
            background-color: lightsalmon;
            display: flex;
            /* flex-direction: row; */
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            flex-direction: column-reverse;
            
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            margin: 2px 2px;
        }
    </style>
</head>
<body>
    <div class="conteiner-1">
        <div class="item">row A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>        
    </div>
        <div class="conteiner-2">
        <div class="item">column A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>        
    </div>
        <div class="conteiner-3">
        <div class="item">row-reverse A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>        
    </div>
        <div class="conteiner-4">
        <div class="item">column-reverse A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>        
    </div>
</body>
</html>
